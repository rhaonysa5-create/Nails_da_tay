<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contato | Manicure [Nome]</title>
<meta name="description" content="WhatsApp, Instagram, endereço e formulário de contato.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contato">
<!-- Cabeçalho, rodapé, WhatsApp e lightbox são inseridos pelo app.js -->
<main>
<section class="top"><div class="wrap ct">
  <div>
    <h2>Vamos conversar?</h2>
    <p class="lead">Tire dúvidas, peça um orçamento de nail art ou combine seu horário.</p>
    <dl>
      <dt>WhatsApp</dt><dd><a class="wal" target="_blank" rel="noopener">(11) 99999-9999</a></dd>
      <dt>Instagram</dt><dd><a class="ial" target="_blank" rel="noopener">@instagram_da_manicure</a></dd>
      <dt>Endereço</dt><dd>Rua das Flores, 123, Centro<br>Sua Cidade, UF</dd>
      <dt>Horário</dt><dd>Segunda a sábado, das 9h às 18h</dd>
    </dl>
  </div>
  <form id="cf">
    <label for="cn">Nome</label><input id="cn" required placeholder="Seu nome">
    <label for="ce">E-mail ou telefone</label><input id="ce" required placeholder="Como posso responder?">
    <label for="cmg">Mensagem</label><textarea id="cmg" rows="4" required placeholder="Conte o que você procura"></textarea>
    <label class="chk"><input type="checkbox" id="cc" required><span>Li e concordo com os <a href="termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>, e autorizo o uso das informações acima, inclusive alergias que eu informar, apenas para responder à minha mensagem.</span></label>
        <button class="btn" type="submit">Enviar mensagem</button>
  </form>
</div></section>
</main>
<script src="app.js"></script>
</body>
</html>
